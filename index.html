<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Only Drill — AIとキミだけの問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0D1B;
    --bg-2:#161329;
    --surface:#1C1932;
    --surface-2:#252042;
    --border:rgba(255,255,255,0.09);
    --text:#F4F2FF;
    --text-dim:#A79FC9;
    --text-faint:#6E668F;
    --accent:#8B6CFF;
    --accent-soft:rgba(139,108,255,0.16);
    --mint:#33E8C4;
    --mint-soft:rgba(51,232,196,0.16);
    --warn:#FF6B85;
    --warn-soft:rgba(255,107,133,0.14);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --font-display:'Space Grotesk', 'Zen Kaku Gothic New', sans-serif;
    --font-body:'Zen Kaku Gothic New', sans-serif;
  }

  :root[data-theme="light"]{
    --bg:#F6F2FB;
    --bg-2:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#ECE5F7;
    --border:rgba(107,76,255,0.14);
    --text:#2E2A40;
    --text-dim:#6A6280;
    --text-faint:#9891A8;
    --accent:#7C5CFF;
    --accent-soft:rgba(124,92,255,0.12);
    --mint:#0FAF93;
    --mint-soft:rgba(15,175,147,0.12);
    --warn:#E14D68;
    --warn-soft:rgba(225,77,104,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(680px 520px at 15% -10%, rgba(139,108,255,0.28), transparent 60%),
      radial-gradient(560px 480px at 105% 15%, rgba(51,232,196,0.16), transparent 60%),
      radial-gradient(700px 600px at 50% 120%, rgba(139,108,255,0.14), transparent 60%);
  }
  :root[data-theme="light"] .glow{
    background:
      radial-gradient(680px 520px at 15% -10%, rgba(139,108,255,0.14), transparent 60%),
      radial-gradient(560px 480px at 105% 15%, rgba(255,170,230,0.14), transparent 60%),
      radial-gradient(700px 600px at 50% 120%, rgba(15,175,147,0.08), transparent 60%);
  }

  #app{
    position:relative; z-index:1;
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:20px 20px 48px;
    display:flex;
    flex-direction:column;
  }

  a{color:inherit;}

  .topbar{display:flex; flex-direction:column; align-items:stretch; gap:10px; margin-bottom:28px;}
  .banner{width:100%; border-radius:var(--radius-lg); display:block; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,0.35);}
  :root[data-theme="light"] .banner{box-shadow:0 10px 26px rgba(124,92,255,0.22);}
  .nav-row{display:flex; justify-content:space-between; align-items:center;}
  .home-link{
    font-size:13px; color:var(--text-dim); text-decoration:none;
    padding:6px 12px; border-radius:999px; border:1px solid var(--border);
    cursor:pointer;
  }
  .home-link:active{background:var(--surface);}

  .stepper{display:flex; align-items:center; gap:6px; margin-bottom:26px;}
  .stepper .dot{flex:1; height:4px; border-radius:4px; background:var(--surface-2); transition:background 0.3s ease;}
  .stepper .dot.done{background:var(--mint);}
  .stepper .dot.active{background:var(--accent); box-shadow:0 0 10px rgba(139,108,255,0.7);}
  .step-label{font-size:12px; color:var(--text-faint); margin-bottom:8px; display:block;}

  main{flex:1; display:flex; flex-direction:column;}

  h1.hero{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(28px, 8vw, 38px); line-height:1.25; margin:6px 0 10px;
    background:linear-gradient(100deg, #FFFFFF 20%, var(--mint) 60%, var(--accent) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  :root[data-theme="light"] h1.hero{
    background:linear-gradient(100deg, #6B4CFF 0%, #0FAF93 55%, #A855F7 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h2.title{font-family:var(--font-display); font-weight:700; font-size:22px; margin:0 0 6px; color:var(--text);}
  p.sub{color:var(--text-dim); font-size:14.5px; margin:0 0 20px;}

  .btn{
    font-family:var(--font-body); font-weight:700; font-size:15.5px;
    border:none; border-radius:999px; padding:15px 22px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(120deg, var(--accent), #6B4CFF); color:#fff; box-shadow:0 8px 24px rgba(139,108,255,0.35); width:100%;}
  .btn-primary:disabled{opacity:0.4; box-shadow:none; cursor:not-allowed;}
  .btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--border); width:100%;}
  .btn-mint{background:linear-gradient(120deg, var(--mint), #1FC9A8); color:#08281F; box-shadow:0 8px 24px rgba(51,232,196,0.28); width:100%;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .btn-small{padding:9px 16px; font-size:13px; width:auto; border-radius:999px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px;}
  .card + .card{margin-top:14px;}

  .callout{
    border:1px solid var(--accent);
    background:linear-gradient(135deg, var(--accent-soft), var(--mint-soft));
    border-radius:var(--radius-lg); padding:20px; margin-bottom:18px;
  }
  .callout .c-title{font-weight:700; font-size:15.5px; margin-bottom:6px;}
  .callout .c-sub{color:var(--text-dim); font-size:13px; margin-bottom:14px;}

  .mission-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:18px; margin-bottom:12px;
    cursor:pointer; transition:transform .15s ease;
  }
  .mission-card:active{transform:scale(0.98);}
  .mission-card.disabled{opacity:0.55;}
  .mission-card .icon{
    width:46px; height:46px; border-radius:14px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .mission-card .body{flex:1; min-width:0;}
  .mission-card .m-title{font-weight:700; font-size:15.5px; margin-bottom:3px;}
  .mission-card .m-sub{font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .tab-toggle{display:flex; background:var(--bg-2); border:1px solid var(--border); border-radius:999px; padding:4px; margin-bottom:20px;}
  .tab-btn{flex:1; text-align:center; padding:10px 0; border-radius:999px; font-size:13.5px; font-weight:700; color:var(--text-dim); cursor:pointer;}
  .tab-btn.active{background:var(--accent); color:#fff;}

  .chip-group{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .chip{
    padding:10px 16px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:14px; font-weight:500;
    cursor:pointer; transition:all 0.15s ease;
  }
  .chip.selected{background:var(--accent-soft); border-color:var(--accent); color:#fff;}
  label.field-label{display:block; font-size:13px; color:var(--text-faint); margin-bottom:10px; font-weight:500;}

  input[type=text], textarea{
    width:100%; background:var(--bg-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); color:var(--text); font-family:var(--font-body);
    font-size:15px; padding:13px 14px; resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .code-card{
    position:relative; background:#0B0A16; border:1px solid var(--border);
    border-radius:var(--radius-md); padding:18px 16px 16px; margin-bottom:16px;
  }
  .code-card .tag{
    position:absolute; top:-11px; left:16px; background:var(--accent); color:#fff;
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; letter-spacing:0.03em;
  }
  .code-card pre{
    margin:0; white-space:pre-wrap; word-break:break-word;
    font-family:'SFMono-Regular', Consolas, monospace; font-size:12.5px; line-height:1.7;
    color:#CFC9F0; max-height:260px; overflow-y:auto;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,5,14,0.72); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:24px; max-width:440px; width:100%; max-height:80vh; overflow-y:auto;
  }
  .modal-card h3{margin:0 0 12px; font-family:var(--font-display); font-weight:700; font-size:17px;}

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--mint); color:#08281F; font-weight:700; font-size:14px;
    padding:12px 20px; border-radius:999px; opacity:0; pointer-events:none;
    transition:all 0.25s ease; z-index:50; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .status-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; margin-bottom:18px;}
  .status-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .status-level{font-family:var(--font-display); font-weight:700; font-size:20px;}
  .status-sub{font-size:11.5px; color:var(--text-faint);}
  .exp-bar{height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden; margin-bottom:12px;}
  .exp-bar > div{height:100%; background:linear-gradient(90deg, var(--accent), var(--mint));}
  .status-stats{display:flex; gap:16px; font-size:12.5px; color:var(--text-dim);}

  .enemy-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:8px; cursor:pointer;}
  .enemy-row:active{transform:scale(0.98);}
  .enemy-row .icon{font-size:20px; flex:none;}
  .enemy-row .body{flex:1; min-width:0;}
  .enemy-row .name{font-weight:700; font-size:14px;}
  .enemy-row .acc{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .enemy-row .state-tag{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); flex:none;}

  .bonus-card{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; cursor:pointer;}
  .bonus-card:active{transform:scale(0.98);}
  .bonus-card.locked{opacity:0.5; cursor:default;}

  .stat-row{display:flex; gap:10px; margin-top:22px;}
  .empty-note{background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-md); padding:16px; text-align:center; color:var(--text-dim); font-size:13.5px;}
  .stat-box{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; text-align:left;}
  .stat-box .num{font-family:var(--font-display); font-size:22px; font-weight:700;}
  .stat-box .lbl{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .recent-list{margin-top:18px; display:flex; flex-direction:column; gap:8px;}
  .recent-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 14px; font-size:13.5px;
  }
  .recent-item .rate{font-weight:700; color:var(--mint);}

  .quiz-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .quiz-tag{font-size:12.5px; color:var(--text-dim);}
  .quiz-count{font-family:var(--font-display); font-size:13px; color:var(--text-faint);}
  .progress-bar{height:6px; background:var(--surface-2); border-radius:6px; overflow:hidden; margin-bottom:22px;}
  .progress-bar > div{height:100%; background:linear-gradient(90deg, var(--accent), var(--mint)); transition:width 0.3s ease;}
  .question-text{font-size:18.5px; font-weight:700; margin-bottom:20px; line-height:1.55;}
  .choice-btn{
    display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:15px 16px; color:var(--text); font-size:15px;
    font-family:var(--font-body); margin-bottom:10px; cursor:pointer; transition:all 0.15s ease;
  }
  .choice-btn:active{transform:scale(0.98);}
  .choice-btn.correct{border-color:var(--mint); background:var(--mint-soft); color:#fff;}
  .choice-btn.pending{border-color:var(--accent); background:var(--accent-soft); color:var(--text);}
  .choice-btn.wrong{border-color:var(--warn); background:var(--warn-soft); color:#fff;}
  .choice-btn.disabled{pointer-events:none;}
  .tf-row{display:flex; gap:12px; margin-bottom:10px;}
  .tf-btn{
    flex:1; padding:26px 0; text-align:center; font-size:28px; font-weight:700;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    cursor:pointer; color:var(--text);
  }
  .tf-btn.correct{border-color:var(--mint); background:var(--mint-soft);}
  .tf-btn.pending{border-color:var(--accent); background:var(--accent-soft);}
  .tf-btn.wrong{border-color:var(--warn); background:var(--warn-soft);}
  .explain-card{
    margin-top:16px; background:var(--bg-2); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:16px; font-size:14px; color:var(--text-dim);
  }
  .explain-card .head{color:var(--mint); font-weight:700; font-size:12.5px; margin-bottom:6px;}

  .ring-wrap{display:flex; justify-content:center; margin:8px 0 22px;}
  .missed-item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:10px; font-size:13.5px;}
  .missed-item .q{font-weight:700; margin-bottom:6px;}
  .missed-item .a{color:var(--mint);}

  .guide-step{display:flex; gap:14px; margin-bottom:20px;}
  .guide-num{
    width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;
  }
  .guide-text{flex:1; font-size:14px; color:var(--text-dim); padding-top:2px;}
  .guide-text b{color:var(--text);}

  .needs-scan-item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:10px;}

  .enemy-bubble-row{display:flex; align-items:flex-end; gap:12px; margin-bottom:18px;}
  .enemy-bubble-icon{font-size:42px; flex:none; filter:drop-shadow(0 4px 10px rgba(139,108,255,0.45));}
  .enemy-bubble{
    position:relative; background:var(--surface); border:1px solid var(--accent);
    border-radius:var(--radius-md); padding:14px 16px; font-weight:700; font-size:15.5px; flex:1;
  }
  .enemy-bubble-tail{
    position:absolute; left:-6px; bottom:14px; width:12px; height:12px;
    background:var(--surface); border-left:1px solid var(--accent); border-bottom:1px solid var(--accent);
    transform:rotate(45deg);
  }

  .scan-frame{
    border:1px solid #E4D9C4; border-radius:var(--radius-lg);
    background:#F7F0E4;
    padding:20px; margin-bottom:18px;
    color:#4A4335;
  }
  .scan-frame > .sub{color:#7A7260; margin-bottom:14px;}
  .scan-item{background:#FFFDF8; border:1px solid #EAE0CC; border-radius:var(--radius-md); padding:14px 16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(120,95,40,0.06);}
  .scan-item-badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; background:rgba(139,108,255,0.14); color:#6B4CFF; margin-bottom:8px;}
  .scan-item-material{font-size:13px; color:#8A8270; margin-bottom:4px;}
  .scan-item-pages{font-family:var(--font-display); font-weight:700; font-size:23px; color:#0E9F86; margin-bottom:4px;}
  .scan-item-unit{font-size:12px; color:#A69E8C;}

  .scan-steps{margin-top:16px; padding-top:16px; border-top:1px dashed #E4D9C4;}
  .scan-step{display:flex; align-items:center; gap:10px; font-size:13.5px; color:#5A5342; margin-bottom:10px;}
  .scan-step:last-child{margin-bottom:0;}
  .scan-step-num{
    width:22px; height:22px; border-radius:50%; background:#6B4CFF; color:#fff;
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .needs-scan-item .m{font-weight:700; font-size:14.5px;}
  .needs-scan-item .p{color:var(--text-dim); font-size:13px; margin-top:3px;}
  .error-note{background:var(--warn-soft); border:1px solid rgba(255,107,133,0.4); border-radius:var(--radius-md); padding:16px; font-size:13.5px; color:#FFD8DE; margin-bottom:16px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>
<div class="glow"></div>
<div id="app"></div>
<div id="toast"></div>

<script>
/* =========================================================
   My Only Drill — AIとキミだけの問題集 (MVP / localStorage only)
   home = 3ミッション → prompt/paste の往復でGeminiと連携。
   create画面で「自分で選ぶ」/「AIに診断してもらう」を切替。
   ========================================================= */

const STORAGE_KEY = "qdrill.v2";
const DEV_PREVIEW = new URLSearchParams(window.location.search).get("preview") === "1";

/* ---------------- sound effects (synthesized, no audio files) ---------------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, startTime, duration, type, peak){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peak || 0.2, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}
function playCorrectSound(){
  try{
    playTone(1046.5, 0, 0.16, "sine", 0.22);
    playTone(1318.5, 0.13, 0.24, "sine", 0.22);
  }catch(e){}
}
function playWrongSound(){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(392, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(311, ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.26);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.28);
  }catch(e){}
}

const SUBJECTS = ["英語","数学","国語","理科","社会"];
const FORMATS = [
  {id:"choice", label:"4択"},
  {id:"true_false", label:"○×"},
  {id:"fill_blank", label:"穴埋め"},
];
const COUNTS = [3,5,8,10];

/* ---------------- storage ---------------- */
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const p = JSON.parse(raw);
    return {
      unitStats: p.unitStats || {},
      sessions: p.sessions || [],
      diagnosis: p.diagnosis || null,
      missedBank: p.missedBank || [],
      enemies: p.enemies || {},
      player: p.player || {exp:0, tokens:0, defeatedCount:0},
      miniGames: p.miniGames || {invader:{unlocked:false, bestScore:0}},
      profile: p.profile || {nextTestDate:"", secondChoiceDate:"", firstChoiceDate:"", birthday:""},
      questionBank: p.questionBank || {},
      settings: p.settings || {theme:"dark"},
    };
  }catch(e){ return defaultData(); }
}
function defaultData(){
  return {
    unitStats:{}, sessions:[], diagnosis:null, missedBank:[],
    enemies:{}, player:{exp:0, tokens:0, defeatedCount:0},
    miniGames:{invader:{unlocked:false, bestScore:0}},
    profile:{nextTestDate:"", secondChoiceDate:"", firstChoiceDate:"", birthday:""},
    questionBank:{},
    settings:{theme:"dark"},
  };
}
function saveData(data){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
let db = loadData();
function applyTheme(){
  document.documentElement.setAttribute("data-theme", (db.settings && db.settings.theme) || "dark");
}
function setTheme(t){
  db.settings.theme = t;
  saveData(db);
  applyTheme();
  render();
}
applyTheme();

function unitKey(subject, unit){ return subject + "::" + (unit||"").trim(); }

function levelInfoFor(subject, unit){
  const key = unitKey(subject, unit);
  const s = db.unitStats[key];
  if(!s || s.attempts === 0) return {level:3, note:"はじめて挑戦する単元だよ", accuracy:null};
  const acc = Math.round((s.correct / s.attempts) * 100);
  let level = acc>=80?4 : acc>=60?3 : acc>=40?2 : 1;
  return {level, note:"直近の正答率 " + acc + "%", accuracy: acc};
}

function recordAttempt(subject, unit, correct){
  const key = unitKey(subject, unit);
  if(!db.unitStats[key]) db.unitStats[key] = {attempts:0, correct:0};
  db.unitStats[key].attempts += 1;
  if(correct) db.unitStats[key].correct += 1;
  saveData(db);
}
function recordSession(subject, unit, score, total){
  db.sessions.unshift({date: new Date().toISOString(), subject, unit, score, total});
  db.sessions = db.sessions.slice(0, 20);
  saveData(db);
}
function addToMissedBank(subject, unit, question){
  const bankId = "m" + Date.now() + Math.floor(Math.random()*1000);
  db.missedBank.unshift({bankId, subject, unit, question});
  db.missedBank = db.missedBank.slice(0, 40);
  saveData(db);
}
function removeFromMissedBank(bankId){
  db.missedBank = db.missedBank.filter(m=>m.bankId!==bankId);
  saveData(db);
}

/* ---------------- enemy system (WEAK -> TRAINING -> DEFEATED) ---------------- */
const EXP_TABLE = [0,100,250,450,700,1000,1350,1750,2200,2700,3250,3850,4500,5200,5950,6750];
function levelFromExp(exp){
  let lvl = 1;
  for(let i=1;i<EXP_TABLE.length;i++){ if(exp >= EXP_TABLE[i]) lvl = i+1; else break; }
  return lvl;
}
function expProgress(exp){
  const lvl = levelFromExp(exp);
  const cur = EXP_TABLE[lvl-1];
  const next = (EXP_TABLE[lvl] !== undefined) ? EXP_TABLE[lvl] : cur + 1000;
  const pct = Math.max(0, Math.min(100, Math.round(((exp-cur)/(next-cur))*100)));
  return {lvl, cur, next, pct};
}

function ensureEnemy(subject, unit, order){
  const k = unitKey(subject, unit);
  if(!db.enemies[k]){
    db.enemies[k] = {subject, unit, state:"WEAK", history:[], createdAt:new Date().toISOString(), order:(typeof order==="number")?order:999};
  } else if(typeof order === "number"){
    db.enemies[k].order = order;
  }
  return k;
}
function registerEnemiesFromDiagnosis(list){
  (list||[]).forEach(en=>{ if(en && en.subject && en.unit) ensureEnemy(en.subject, en.unit, en.order); });
  saveData(db);
}
function activeEnemies(){
  return Object.entries(db.enemies)
    .filter(([id,e])=>e.state !== "DEFEATED")
    .map(([id,e])=>Object.assign({id}, e));
}
function earliestActiveEnemyInSubject(subject){
  const candidates = activeEnemies().filter(e=>e.subject === subject);
  if(!candidates.length) return null;
  candidates.sort((a,b)=>(a.order ?? 999) - (b.order ?? 999));
  return candidates[0];
}
function enemyAccuracyLabel(e){
  if(!e.history || e.history.length === 0) return "未挑戦";
  const c = e.history.filter(Boolean).length;
  return Math.round((c/e.history.length)*100) + "%";
}
function checkGameUnlocks(){
  if(db.player.defeatedCount >= 1 && !db.miniGames.invader.unlocked){
    db.miniGames.invader.unlocked = true;
  }
}
function recordEnemyAttempt(enemyId, correct){
  const e = db.enemies[enemyId];
  if(!e) return {defeated:false};
  if(e.state === "WEAK") e.state = "TRAINING";
  e.history.push(correct);
  if(e.history.length > 5) e.history.shift();
  db.player.exp += correct ? 2 : 0;
  let defeated = false;
  if(e.state !== "DEFEATED" && e.history.length >= 5){
    const correctCount = e.history.filter(Boolean).length;
    const len = e.history.length;
    const lastTwoBothWrong = e.history[len-1]===false && e.history[len-2]===false;
    if(correctCount >= 4 && !lastTwoBothWrong){
      e.state = "DEFEATED";
      e.defeatedAt = new Date().toISOString();
      db.player.exp += 50;
      db.player.tokens += 1;
      db.player.defeatedCount = (db.player.defeatedCount||0) + 1;
      defeated = true;
      checkGameUnlocks();
    }
  }
  saveData(db);
  return {defeated, subject:e.subject, unit:e.unit};
}

/* ---------------- question bank (bulk-generated questions per enemy) ---------------- */
function mergeIntoBank(enemyId, subject, unit, mode, questions){
  if(!Array.isArray(questions) || questions.length === 0) return 0;
  if(!db.questionBank[enemyId]) db.questionBank[enemyId] = {subject, unit, mode: mode||"choice", questions:[]};
  const bank = db.questionBank[enemyId];
  const existingTexts = new Set(bank.questions.map(q=>q.question));
  let added = 0;
  questions.forEach(q=>{
    if(q && q.question && !existingTexts.has(q.question)){
      bank.questions.push(Object.assign({}, q, {stats:{attempts:0, correct:0, lastAnsweredAt:0}}));
      existingTexts.add(q.question);
      added++;
    }
  });
  saveData(db);
  return added;
}
function bankCountFor(subject, unit){
  const b = db.questionBank[unitKey(subject, unit)];
  return b ? b.questions.length : 0;
}
function drawFromBank(enemyId, count){
  const bank = db.questionBank[enemyId];
  if(!bank || !bank.questions.length) return null;
  const pool = bank.questions.map((q, idx)=>({q, idx}));
  pool.sort((a,b)=>{
    const as = a.q.stats || {attempts:0, lastAnsweredAt:0};
    const bs = b.q.stats || {attempts:0, lastAnsweredAt:0};
    if(as.attempts !== bs.attempts) return as.attempts - bs.attempts;
    return (as.lastAnsweredAt||0) - (bs.lastAnsweredAt||0);
  });
  const picked = pool.slice(0, Math.min(count, pool.length));
  for(let i=picked.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=picked[i]; picked[i]=picked[j]; picked[j]=t; }
  return picked.map(p=>Object.assign({}, p.q, {_bankKey: enemyId, _bankIdx: p.idx}));
}
function recordBankAnswer(bankKey, bankIdx, correct){
  const bank = db.questionBank[bankKey];
  if(!bank || !bank.questions[bankIdx]) return;
  const q = bank.questions[bankIdx];
  if(!q.stats) q.stats = {attempts:0, correct:0, lastAnsweredAt:0};
  q.stats.attempts++;
  if(correct) q.stats.correct++;
  q.stats.lastAnsweredAt = Date.now();
  saveData(db);
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 1800);
}
function copyText(text, msg){
  const done = () => showToast(msg || "コピーしたよ！");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ showToast("コピーできなかった…手動で選んでコピーしてね"); }
  document.body.removeChild(ta);
}

/* ---------------- JSON parsing ---------------- */
function extractJson(raw){
  const start = raw.indexOf("{");
  const end = raw.lastIndexOf("}");
  if(start === -1 || end === -1 || end < start) return null;
  try{ return JSON.parse(raw.slice(start, end+1)); }catch(e){ return null; }
}
function validateParsed(obj){ return !!obj && Array.isArray(obj.questions); }

function startMission(key){
  if(key === "quick"){
    if(db.missedBank.length === 0){ showToast("復習できる問題がまだないよ。まずは1問解いてみよう！"); return; }
    startReviewQuiz();
    return;
  }
  const d = db.diagnosis;
  if(!d){ showToast("先に苦手を診断してみよう"); openCreate("diagnosis"); return; }
  const plan = key === "today" ? (d.recommendedPlan && d.recommendedPlan.todayMission)
                                : (d.recommendedPlan && d.recommendedPlan.weakFocus);
  if(!plan){ showToast("おすすめが見つからなかった…自分で選んでみて"); openCreate("manual"); return; }
  let targetSubject = plan.subject, targetUnit = plan.unit;
  if(key === "today"){
    const earliest = earliestActiveEnemyInSubject(plan.subject);
    if(earliest){ targetUnit = earliest.unit; }
  }
  const enemyId = ensureEnemy(targetSubject, targetUnit);
  const bankQuestions = drawFromBank(enemyId, 8);
  if(bankQuestions && bankQuestions.length > 0){
    state.reviewMode = false;
    state.currentEnemyId = enemyId;
    state.parsed = {subject: targetSubject, unit: targetUnit, questions: bankQuestions};
    state.flow = "quiz";
    state.quiz = {index:0, correct:0, answered:false, lastChoice:null, missed:[], pendingChoice:null};
    goto("quiz");
    return;
  }
  state.reviewMode = false;
  state.currentEnemyId = enemyId;
  state.form = {subject:targetSubject, unit:targetUnit, format:"choice", count:8};
  const li = levelInfoFor(state.form.subject, state.form.unit);
  state.promptText = buildPrompt(state.form, li);
  state.flow = "quiz";
  goto("prompt");
}
function startReviewQuiz(){
  const picked = db.missedBank.slice(0, 5);
  state.parsed = {
    subject: "復習ミッション", unit: "まとめ", mode: "mixed",
    questions: picked.map(item => Object.assign({}, item.question, {_bankId:item.bankId})),
  };
  state.reviewMode = true;
  state.currentEnemyId = null;
  state.flow = "review";
  state.quiz = {index:0, correct:0, answered:false, lastChoice:null, missed:[], pendingChoice:null};
  goto("quiz");
}
function startEnemyDrill(enemyId){
  const e = db.enemies[enemyId];
  if(!e) return;
  const bankQuestions = drawFromBank(enemyId, 8);
  if(bankQuestions && bankQuestions.length > 0){
    state.reviewMode = false;
    state.currentEnemyId = enemyId;
    state.parsed = {subject: e.subject, unit: e.unit, questions: bankQuestions};
    state.flow = "quiz";
    state.quiz = {index:0, correct:0, answered:false, lastChoice:null, missed:[], pendingChoice:null};
    goto("quiz");
    return;
  }
  state.reviewMode = false;
  state.currentEnemyId = enemyId;
  state.form = {subject:e.subject, unit:e.unit, format:"choice", count:8};
  const li = levelInfoFor(e.subject, e.unit);
  state.promptText = buildPrompt(state.form, li);
  state.flow = "quiz";
  goto("prompt");
}

let invaderState = null;
let invaderRAF = null;

function startInvaderGame(){
  const canvas = document.getElementById("invaderCanvas");
  if(!canvas) return;
  invaderState = {
    shipX: canvas.width/2 - 15, shipW: 30, shipH: 12,
    aliens: [], bullets: [], dx: 1.3, score: 0,
    startTime: null, timeLeft: 45, lastShotTs: 0, over: false, win: false,
  };
  const cols=6, rows=3, gapX=8, gapY=10, aw=22, ah=14, startX=14, startY=20;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      invaderState.aliens.push({x:startX+c*(aw+gapX), y:startY+r*(ah+gapY), w:aw, h:ah, alive:true});
    }
  }
  canvas.addEventListener("pointermove", invaderPointerMove);
  canvas.addEventListener("pointerdown", invaderPointerMove);
  invaderRAF = requestAnimationFrame(invaderLoop);
}
function invaderPointerMove(e){
  if(!invaderState || invaderState.over) return;
  const canvas = document.getElementById("invaderCanvas");
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  invaderState.shipX = Math.max(0, Math.min(canvas.width - invaderState.shipW, x - invaderState.shipW/2));
}
function stopInvaderGame(){
  if(invaderRAF) cancelAnimationFrame(invaderRAF);
  invaderRAF = null;
  const canvas = document.getElementById("invaderCanvas");
  if(canvas){
    canvas.removeEventListener("pointermove", invaderPointerMove);
    canvas.removeEventListener("pointerdown", invaderPointerMove);
  }
  invaderState = null;
}
function invaderLoop(ts){
  if(!invaderState) return;
  const canvas = document.getElementById("invaderCanvas");
  if(!canvas){ invaderRAF = null; return; }
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const s = invaderState;
  if(s.startTime === null) s.startTime = ts;

  if(!s.over){
    s.timeLeft = Math.max(0, 45 - (ts - s.startTime)/1000);
    if(s.timeLeft <= 0){ endInvaderGame(false); }

    let hitEdge = false;
    s.aliens.forEach(a=>{ if(a.alive){ a.x += s.dx; if(a.x<=0 || a.x+a.w>=W) hitEdge = true; } });
    if(hitEdge){
      s.dx *= -1.06;
      s.aliens.forEach(a=>{ if(a.alive) a.y += 10; });
    }
    const shipY = H - 24;
    s.aliens.forEach(a=>{ if(a.alive && a.y + a.h >= shipY) endInvaderGame(false); });

    if(ts - s.lastShotTs > 450){
      s.bullets.push({x: s.shipX + s.shipW/2 - 2, y: shipY - 4, w:4, h:10});
      s.lastShotTs = ts;
    }
    s.bullets.forEach(b=> b.y -= 6);
    s.bullets = s.bullets.filter(b=> b.y > -10);
    s.bullets.forEach(b=>{
      s.aliens.forEach(a=>{
        if(a.alive && b.x < a.x+a.w && b.x+b.w > a.x && b.y < a.y+a.h && b.y+b.h > a.y){
          a.alive = false; b.hit = true; s.score += 10;
        }
      });
    });
    s.bullets = s.bullets.filter(b=> !b.hit);
    if(s.aliens.length && s.aliens.every(a=> !a.alive)){ s.score += 50; endInvaderGame(true); }
  }

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#0B0A16"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#33E8C4";
  s.aliens.forEach(a=>{ if(a.alive) ctx.fillRect(a.x,a.y,a.w,a.h); });
  ctx.fillStyle = "#FFD166";
  s.bullets.forEach(b=> ctx.fillRect(b.x,b.y,b.w,b.h));
  ctx.fillStyle = "#8B6CFF";
  ctx.fillRect(s.shipX, H-24, s.shipW, s.shipH);

  const scoreEl = document.getElementById("invScore");
  const timeEl = document.getElementById("invTime");
  if(scoreEl) scoreEl.textContent = s.score;
  if(timeEl) timeEl.textContent = Math.ceil(s.timeLeft);

  if(!s.over) invaderRAF = requestAnimationFrame(invaderLoop);
}
function endInvaderGame(win){
  if(!invaderState || invaderState.over) return;
  invaderState.over = true;
  invaderState.win = win;
  if(invaderState.score > db.miniGames.invader.bestScore) db.miniGames.invader.bestScore = invaderState.score;
  saveData(db);
  if(invaderRAF) cancelAnimationFrame(invaderRAF);
  invaderRAF = null;
  const area = document.getElementById("invEndArea");
  if(area){
    area.innerHTML = `
      <div class="callout" style="text-align:center; margin-top:16px;">
        <div class="c-title" style="font-size:18px;">${win ? "🎉 CLEAR!" : "TIME UP"}</div>
        <div class="c-sub">スコア ${invaderState.score}（ベスト ${db.miniGames.invader.bestScore}）</div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="goto('minigame')">もう一度</button>
          <button class="btn btn-primary" onclick="goto('home')">ホームへ</button>
        </div>
      </div>
    `;
  }
}

  return `
    <h2 class="title">${isDiag ? "Geminiに渡す診断プロンプト" : "Geminiに渡す文章"}</h2>
    <p class="sub">${isDiag ? "コピーして、Geminiに貼り付けてね。苦手を分析してもらうよ。" : "コピーして、Gemini（そのNotebookをアタッチしたGem）に貼り付けてね。"}</p>
    <div class="code-card">
      <span class="tag">${isDiag ? "診断プロンプト" : "PROMPT"}</span>
      <pre>${escapeHtml(state.promptText)}</pre>
    </div>
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn btn-mint" onclick="copyText(state.promptText, 'コピーしたよ')">コピーする</button>
      <button class="btn btn-ghost" onclick="window.open('https://gemini.google.com/','_blank')">Geminiを開く</button>
    </div>
    <button class="btn btn-primary" onclick="goto('paste')">貼り付け画面へ →</button>
  `;
}

function renderPaste(){
  const isDiag = state.flow === "diagnosis";
  return `
    <h2 class="title">${isDiag ? "診断結果を貼ってね" : "Geminiの返事を貼ってね"}</h2>
    <p class="sub">出力された内容を、全部そのままコピーして貼り付けてね。</p>
    <textarea id="pasteArea" rows="8" placeholder="ここに貼り付け"></textarea>
    <div style="height:14px;"></div>
    <button class="btn btn-primary" onclick="loadPasted()">読み込む</button>
  `;
}

function loadPasted(){
  const raw = document.getElementById("pasteArea").value;
  const obj = extractJson(raw);

  if(state.flow === "diagnosis"){
    if(!obj || !obj.diagnosis){ showPasteError(); return; }
    const diag = obj.diagnosis;
    db.diagnosis = diag;
    db.diagnosis.updatedAt = new Date().toISOString();
    if(Array.isArray(diag.enemies)) registerEnemiesFromDiagnosis(diag.enemies);

    const bankList = Array.isArray(diag.questionBank) ? diag.questionBank : [];
    let addedCount = 0;
    let pendingScans = [];
    bankList.forEach(entry=>{
      if(!entry || !entry.subject || !entry.unit) return;
      const eid = ensureEnemy(entry.subject, entry.unit);
      if(Array.isArray(entry.questions) && entry.questions.length > 0){
        addedCount += mergeIntoBank(eid, entry.subject, entry.unit, entry.mode, entry.questions);
      }
      if(Array.isArray(entry.needsScan) && entry.needsScan.length > 0){
        entry.needsScan.forEach(ns=>{
          pendingScans.push(Object.assign({subject: entry.subject, unit: entry.unit}, ns));
        });
      }
    });
    saveData(db);

    if(pendingScans.length > 0){
      state.parsed = {subject:"", unit:"", questions:[], needsScan: pendingScans};
      showToast(addedCount > 0 ? addedCount + "問できたよ。あと少しだけ資料が必要な単元もあるみたい" : "診断は完了。あと少しだけ資料が必要みたい");
      goto("needsScan");
      return;
    }
    if(addedCount > 0){
      showToast(addedCount + "問の問題ができたよ！");
    } else {
      showToast("診断が完了したよ！新しい敵が見つかったよ");
    }
    goto("home");
    return;
  }

  if(!validateParsed(obj)){ showPasteError(); return; }
  state.parsed = obj;
  if((!obj.questions || obj.questions.length===0) && obj.needsScan && obj.needsScan.length>0){ goto("needsScan"); return; }
  if(!obj.questions || obj.questions.length===0){ showPasteError(); return; }
  if(state.currentEnemyId){ mergeIntoBank(state.currentEnemyId, obj.subject, obj.unit, obj.mode, obj.questions); }
  state.reviewMode = false;
  state.quiz = {index:0, correct:0, answered:false, lastChoice:null, missed:[], pendingChoice:null};
  goto("quiz");
}
function showPasteError(){
  const fixMsg = "JSON形式のみで、コードブロック（```json 〜 ```）の中に入れて出力し直してください";
  document.querySelector("main").innerHTML = `
    <h2 class="title">うまく読み取れなかった…</h2>
    <div class="error-note">貼り付けた内容がJSONとして読み取れなかったよ。下のメッセージをコピーしてGeminiにもう一度送ってみてね。</div>
    <div class="code-card">
      <span class="tag">送るメッセージ</span>
      <pre>${fixMsg}</pre>
    </div>
    <button class="btn btn-mint" style="margin-bottom:12px;" onclick="copyText('${fixMsg}')">コピーする</button>
    <button class="btn btn-ghost" onclick="goto('paste')">貼り付け画面に戻る</button>
  `;
}

/* ---------------- needs scan ---------------- */
function renderNeedsScan(){
  const items = state.parsed.needsScan || [];
  const isDiag = state.flow === "diagnosis";
  const continueBlock = isDiag ? `
    <div class="code-card">
      <span class="tag">③ 送るメッセージ</span>
      <pre>${escapeHtml(buildContinuePrompt())}</pre>
    </div>
    <button class="btn btn-mint" style="margin-bottom:12px;" onclick="copyText(buildContinuePrompt(), 'コピーしたよ')">コピーする</button>
    <p class="sub" style="margin-bottom:16px;">コピーしたら、さっきのGeminiの会話（新しいチャットじゃないよ）に貼り付けて送ってね。</p>
    <button class="btn btn-primary" onclick="goto('paste')">貼り付け画面へ →</button>
  ` : `
    <button class="btn btn-primary" style="margin-top:8px;" onclick="goto('prompt')">プロンプト画面へ戻る</button>
  `;

  const typeInfo = (t)=>{
    if(t === "textbook") return {icon:"📕", label:"教科書"};
    if(t === "workbook") return {icon:"📘", label:"ワーク"};
    return {icon:"📄", label:"資料"};
  };
  const formatPages = (p)=>{
    if(!p) return "";
    const s = String(p).trim();
    return /^p\.?\s*\d/i.test(s) ? s : "p." + s;
  };

  return `
    <div class="enemy-bubble-row">
      <div class="enemy-bubble-icon">👾</div>
      <div class="enemy-bubble">
        <div class="enemy-bubble-tail"></div>
        先にスキャンが必要みたい！
      </div>
    </div>

    <div class="scan-frame">
      <p class="sub" style="margin-bottom:14px;">下のページを写真に撮って、Geminiに送ってね。</p>

      ${items.map(it=>{
        const ti = typeInfo(it.type);
        return `
        <div class="scan-item">
          <div class="scan-item-badge">${ti.icon} ${ti.label}</div>
          <div class="scan-item-material">${escapeHtml(it.material || "資料")}</div>
          <div class="scan-item-pages">${escapeHtml(formatPages(it.pages))}</div>
          ${it.subject && it.unit ? `<div class="scan-item-unit">${escapeHtml(it.subject)}｜${escapeHtml(it.unit)}</div>` : ""}
        </div>`;
      }).join("")}

      <div class="scan-steps">
        <div class="scan-step"><span class="scan-step-num">1</span>上のページをスマホのカメラで撮影する</div>
        <div class="scan-step"><span class="scan-step-num">2</span>さっきのGeminiの会話に、その写真を追加する</div>
        <div class="scan-step"><span class="scan-step-num">3</span>下のメッセージをコピーして送る</div>
      </div>
    </div>

    ${continueBlock}
  `;
}

/* ---------------- quiz ---------------- */
function renderQuiz(){
  const qs = state.parsed.questions;
  const q = qs[state.quiz.index];
  const total = qs.length;
  const pct = Math.round((state.quiz.index / total) * 100);

  let body = "";
  if(q.type === "choice"){
    body = (q.choices||[]).map((c,i)=>{
      let cls = "choice-btn";
      if(state.quiz.answered){
        cls += " disabled";
        if(i === q.answer) cls += " correct";
        else if(i === state.quiz.lastChoice) cls += " wrong";
      } else if(state.quiz.pendingChoice === i){
        cls += " pending";
      }
      return `<button class="${cls}" onclick="selectChoice(${i})" ${state.quiz.answered?'disabled':''}>${escapeHtml(c)}</button>`;
    }).join("");
    if(!state.quiz.answered){
      const ready = state.quiz.pendingChoice !== null && state.quiz.pendingChoice !== undefined;
      body += `<button class="btn btn-primary" style="margin-top:8px;" onclick="confirmChoice()" ${ready?'':'disabled'}>けってい！</button>`;
    }
  } else if(q.type === "true_false"){
    const answered = state.quiz.answered;
    const pending = state.quiz.pendingChoice;
    const correctVal = (q.answer === true || q.answer === 1);
    body = `
      <div class="tf-row">
        <button class="tf-btn ${answered ? (correctVal? 'correct':(state.quiz.lastChoice===true?'wrong':'')) : (pending===true?'pending':'')}" onclick="selectTF(true)" ${answered?'disabled':''}>○</button>
        <button class="tf-btn ${answered ? (!correctVal? 'correct':(state.quiz.lastChoice===false?'wrong':'')) : (pending===false?'pending':'')}" onclick="selectTF(false)" ${answered?'disabled':''}>×</button>
      </div>`;
    if(!answered){
      const ready = pending !== null && pending !== undefined;
      body += `<button class="btn btn-primary" style="margin-top:4px;" onclick="confirmTF()" ${ready?'':'disabled'}>けってい！</button>`;
    }
  } else if(q.type === "fill_blank"){
    body = `
      <input type="text" id="fillInput" placeholder="こたえを入力" ${state.quiz.answered?'disabled':''} value="${state.quiz.answered ? escapeAttr(state.quiz.lastChoice||'') : ''}">
      <div style="height:12px;"></div>
      ${state.quiz.answered ? "" : `<button class="btn btn-primary" onclick="answerFill()">けってい！</button>`}
    `;
  }

  let explain = "";
  if(state.quiz.answered){
    explain = `
      <div class="explain-card">
        <div class="head">解説</div>
        ${escapeHtml(q.explanation || "")}
      </div>
      <div style="height:16px;"></div>
      <button class="btn btn-primary" onclick="nextQuestion()">${state.quiz.index+1 < total ? "つぎへ →" : "結果を見る →"}</button>
    `;
  }

  return `
    <div class="quiz-meta">
      <span class="quiz-tag">${escapeHtml(state.parsed.subject||"")} ・ ${escapeHtml(state.parsed.unit||"")}</span>
      <span class="quiz-count">${state.quiz.index+1} / ${total}</span>
    </div>
    <div class="progress-bar"><div style="width:${pct}%"></div></div>
    <div class="card">
      <div class="question-text">${formatQuestionHtml(q.question)}</div>
      ${body}
    </div>
    ${explain}
  `;
}

function handleEnemyProgress(q, correct){
  if(q && q._bankKey !== undefined && q._bankIdx !== undefined){
    recordBankAnswer(q._bankKey, q._bankIdx, correct);
  }
  if(!state.currentEnemyId) return;
  const res = recordEnemyAttempt(state.currentEnemyId, correct);
  if(res.defeated){ state.enemyJustDefeated = {subject: res.subject, unit: res.unit}; }
}
function selectChoice(i){
  if(state.quiz.answered) return;
  state.quiz.pendingChoice = i;
  render();
}
function confirmChoice(){
  if(state.quiz.answered) return;
  const i = state.quiz.pendingChoice;
  if(i === null || i === undefined) return;
  const q = state.parsed.questions[state.quiz.index];
  const correct = i === q.answer;
  state.quiz.answered = true; state.quiz.lastChoice = i;
  playAnswerSound(correct);
  if(correct){
    state.quiz.correct++;
    if(state.reviewMode && q._bankId) removeFromMissedBank(q._bankId);
  } else {
    state.quiz.missed.push(q);
    if(!state.reviewMode) addToMissedBank(state.parsed.subject, state.parsed.unit, q);
  }
  if(!state.reviewMode) recordAttempt(state.parsed.subject, state.parsed.unit, correct);
  handleEnemyProgress(q, correct);
  render();
}
function selectTF(val){
  if(state.quiz.answered) return;
  state.quiz.pendingChoice = val;
  render();
}
function confirmTF(){
  if(state.quiz.answered) return;
  const val = state.quiz.pendingChoice;
  if(val === null || val === undefined) return;
  const q = state.parsed.questions[state.quiz.index];
  const correctVal = (q.answer === true || q.answer === 1);
  const correct = val === correctVal;
  state.quiz.answered = true; state.quiz.lastChoice = val;
  playAnswerSound(correct);
  if(correct){
    state.quiz.correct++;
    if(state.reviewMode && q._bankId) removeFromMissedBank(q._bankId);
  } else {
    state.quiz.missed.push(q);
    if(!state.reviewMode) addToMissedBank(state.parsed.subject, state.parsed.unit, q);
  }
  if(!state.reviewMode) recordAttempt(state.parsed.subject, state.parsed.unit, correct);
  handleEnemyProgress(q, correct);
  render();
}
function answerFill(){
  const q = state.parsed.questions[state.quiz.index];
  const val = document.getElementById("fillInput").value.trim();
  const norm = s => (s||"").trim().toLowerCase();
  const correct = norm(val) === norm(q.answer);
  state.quiz.answered = true; state.quiz.lastChoice = val;
  playAnswerSound(correct);
  if(correct){
    state.quiz.correct++;
    if(state.reviewMode && q._bankId) removeFromMissedBank(q._bankId);
  } else {
    state.quiz.missed.push(q);
    if(!state.reviewMode) addToMissedBank(state.parsed.subject, state.parsed.unit, q);
  }
  if(!state.reviewMode) recordAttempt(state.parsed.subject, state.parsed.unit, correct);
  handleEnemyProgress(q, correct);
  render();
}
function nextQuestion(){
  const total = state.parsed.questions.length;
  if(state.quiz.index + 1 < total){
    state.quiz.index++; state.quiz.answered = false; state.quiz.lastChoice = null; state.quiz.pendingChoice = null;
    render();
  } else {
    if(!state.reviewMode) recordSession(state.parsed.subject, state.parsed.unit, state.quiz.correct, total);
    goto("result");
  }
}

/* ---------------- result ---------------- */
function renderResult(){
  const total = state.parsed.questions.length;
  const correct = state.quiz.correct;
  const pct = Math.round((correct/total)*100);
  let reaction = "ここが伸びしろ！つぎで挽回しよう";
  if(pct >= 80) reaction = "やった、バッチリ！";
  else if(pct >= 50) reaction = "いい感じ、あと少し！";

  const r = 54, c = 2*Math.PI*r;
  const dash = c * (pct/100);

  const defeated = state.enemyJustDefeated;
  state.enemyJustDefeated = null;
  const defeatedHtml = defeated ? `
    <div class="callout" style="border-color:var(--mint); background:linear-gradient(135deg, var(--mint-soft), var(--accent-soft)); text-align:center;">
      <div style="font-size:30px; margin-bottom:4px;">💥</div>
      <div class="c-title" style="font-size:17px;">ENEMY DEFEATED!</div>
      <div class="c-sub" style="margin-bottom:0;">${escapeHtml(defeated.subject)}「${escapeHtml(defeated.unit)}」を攻略した！ +50 EXP・GAME TOKEN ×1</div>
    </div>
  ` : "";

  const missedHtml = state.quiz.missed.length ? `
    <p class="sub" style="margin-top:22px;">間違えた問題</p>
    ${state.quiz.missed.map(q=>`
      <div class="missed-item">
        <div class="q">${formatQuestionHtml(q.question)}</div>
        <div class="a">${escapeHtml(q.explanation||"")}</div>
      </div>`).join("")}
  ` : `<p class="sub" style="margin-top:22px;">全問正解！間違いなしだよ。</p>`;

  return `
    ${defeatedHtml}
    <h2 class="title">${reaction}</h2>
    <div class="ring-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="${r}" stroke="var(--surface-2)" stroke-width="12" fill="none"/>
        <circle cx="70" cy="70" r="${r}" stroke="url(#grad)" stroke-width="12" fill="none"
          stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 70 70)"/>
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--accent)"/>
            <stop offset="100%" stop-color="var(--mint)"/>
          </linearGradient>
        </defs>
        <text x="70" y="66" fill="var(--text)" font-family="Space Grotesk" font-weight="700" font-size="26" text-anchor="middle">${pct}%</text>
        <text x="70" y="86" fill="var(--text-dim)" font-size="11" text-anchor="middle">${correct}/${total}問</text>
      </svg>
    </div>
    ${missedHtml}
    <div class="btn-row" style="margin-top:20px;">
      <button class="btn btn-ghost" onclick="openCreate('manual')">つぎの学習へ</button>
      <button class="btn btn-primary" onclick="goto('home')">ホームへ</button>
    </div>
  `;
}


/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str==null?"":str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,"&quot;"); }

function formatQuestionText(text){
  if(!text) return "";
  let t = String(text);
  const boundaryRe = /[\u3040-\u30FF\u4E00-\u9FFF。、」』]\s*([A-Za-z0-9_\(])/;
  const m = boundaryRe.exec(t);
  if(m){
    const cjkEnd = m.index + 1;
    const latinStart = m.index + m[0].length - 1;
    if(t[cjkEnd] !== "\n"){
      t = t.slice(0, cjkEnd) + "\n" + t.slice(latinStart);
    }
  }
  t = t.replace(/\(\s*\)/g, "(　　)");
  return t;
}
function formatQuestionHtml(text){
  return escapeHtml(formatQuestionText(text)).replace(/\n/g, "<br>");
}

render();
</script>
